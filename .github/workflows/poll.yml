name: GPU-Preisalarm

on:
  # Main trigger: cron-job.org calls the workflow_dispatch API every 15 min (GitHub's own
  # schedule fires very unreliably for this repo). The schedule below is only a backup.
  # main.py --once decides itself whether a poll is due (30 min normally, 15 min in the hot phase).
  # Off-peak minutes on purpose: GitHub delays/drops scheduled runs most at the start of the hour.
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the 10-minute minimum gap"
        type: boolean
        default: false

permissions:
  contents: write  # to commit the price history back
  pages: write     # to publish the overview page
  id-token: write  # required by deploy-pages

concurrency:
  group: gpu-price-alert
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Latest main, not the commit at trigger time: a run that waited in the concurrency queue
      # would otherwise start from a stale price DB (double poll + merge conflict on push).
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll prices
        id: poll
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --once ${{ inputs.force && '--force' || '' }}

      - name: Save price history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/prices.sqlite3
          git diff --cached --quiet && exit 0
          git commit -q -m "Preisdaten $(date -u +%Y-%m-%dT%H:%MZ)"
          # Retry: GitHub sometimes answers a push with "Internal Server Error". If the binary DB
          # conflicts anyway, keep this run's version (-X theirs = the commit being rebased).
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1

      # Pages only when prices were actually fetched (main.py writes polled=true);
      # "not due" runs skip it, so half as many deploys.
      - name: Build overview page
        if: always() && steps.poll.outputs.polled == 'true'
        run: python dashboard.py --out site

      - uses: actions/configure-pages@v6
        if: always() && steps.poll.outputs.polled == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: always() && steps.poll.outputs.polled == 'true'
        with:
          path: site

      - name: Publish overview page
        id: deployment
        if: always() && steps.poll.outputs.polled == 'true'
        # GitHub sometimes can't find the just-uploaded artifact (transient); the page just
        # updates on the next run, so don't mark the whole run as failed for that.
        continue-on-error: true
        uses: actions/deploy-pages@v5
