      - "https://www.alternate.de/ASUS/GeForce-RTX-5070-Ti-TUF-GAMING-OC-Grafikkarte/html/product/100110150"
      - "https://www.proshop.de/Grafikkarte/ASUS-GeForce-RTX-5070-Ti-TUF-OC-16GB-GDDR7-RAM-Grafikkarte/3331057"
