poll:
  default_interval_minutes: 30   # used by "python main.py" loop; GitHub Actions uses the cron in poll.yml
  hot_phase:
    start: "2026-11-26T00:00:00+01:00"
    end:   "2026-11-30T23:59:00+01:00"
    interval_minutes: 15
  jitter_seconds: 120
  run_until: null          # no end date (was 01.12.2026); stop by disabling the workflow
  delay_between_requests_seconds: 8   # pause between two requests to the same site (x1.0-1.5 random); Geizhals answers 429 if faster
  max_pages: 2
  timezone: "Europe/Berlin"

filters:
  max_delivery_days: 5
  include_shipping: false     # compare the card price only (shipping ignored)
  shop_whitelist:            # matched case-insensitively, ".de/.net/.com" ignored
    - Mindfactory
    - Alternate
    - Caseking
    - Notebooksbilliger
    - Proshop
    - Computeruniverse
    - Galaxus
    - Cyberport
    - Amazon.de              # only Amazon itself; marketplace sellers are excluded below
  exclude_merchant_keywords: ["marketplace", "ebay", "stores", "filiale"]

rules_default:
  drop_percent: 8
  median_days: 7
  new_low_min_history_days: 3
  realert_min_extra_drop_percent: 2
  realert_cooldown_hours: 12
  quiet_hours: ["00:00", "07:00"]     # except target-price hits
  suspicious_below_median_percent: 40
  great_deal_drop_percent: 12        # green "Top-Deal" also when this far below the 7-day median
  daily_report_time: "20:00"

notify:
  ntfy:
    enabled: true
    server: "https://ntfy.sh"
    topic: "${NTFY_TOPIC}"            # set in .env
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

database: "data/prices.sqlite3"
dashboard_url: "https://filipstanicak.github.io/gpu-price-alert/"   # overview page (GitHub Pages)

# Mindfactory and Proshop block requests from GitHub's cloud servers (403 / block page).
# They work from a home internet connection - remove them here if you run the app on your own PC.
disabled_sources: ["mindfactory", "proshop"]

products:
  # Variants are grouped per card when Geizhals lists IDENTICAL specs (clocks, cooler, TGP, size),
  # i.e. only colour/design/bundle differs. Technically worse variants are left out on purpose.
  # Every page must carry one of the listed MPNs exactly.

  # ---------------- Radeon RX 9070 XT ----------------
  - id: rd-9070xt
    name: "PowerColor Red Devil RX 9070 XT"
    short_name: "Red Devil 9070 XT"
    urls:                     # Standard, Spectral White, Limited + Special Edition (Limited/Special: + GPU holder)
      - "https://geizhals.de/powercolor-red-devil-radeon-rx-9070-xt-a3397494.html"
      - "https://geizhals.de/powercolor-red-devil-spectral-white-radeon-rx-9070-xt-rx9070xt-16g-e-oc-white-a3467738.html"
      - "https://geizhals.de/powercolor-red-devil-radeon-rx-9070-xt-limited-edition-rx9070xt-16g-e-oc-limited-a3430129.html"
      - "https://geizhals.de/powercolor-red-devil-radeon-rx-9070-xt-special-edition-rx9070xt-16g-e-oc-bp-a3500307.html"
    shop_urls:
      - "https://www.mindfactory.de/product_info.php/16GB-PowerColor-Radeon-RX-9070-XT-Red-Devil-Aktiv-PCIe-5-0-x16--Retail-_1615545.html"
      - "https://www.alternate.de/PowerColor/Radeon-RX-9070-XT-Red-Devil-16GB-OC-Grafikkarte/html/product/100108856"
      - "https://www.alternate.de/PowerColor/Radeon-RX-9070-XT-Red-Devil-16GB-OC-WHITE-Grafikkarte/html/product/100122070"
      - "https://www.proshop.de/Grafikkarte/PowerColor-Radeon-RX-9070-XT-Red-Devil-16GB-GDDR6-RAM-Grafikkarte/3331588"
    mpns: ["RX9070XT 16G-E/OC", "RX9070XT 16G-E/OC/WHITE", "RX9070XT 16G-E/OC/LIMITED", "RX9070XT 16G-E/OC/BP"]
    target_price: 979         # ~8 % unter aktuell 1.064 €; Hellhound ~999 €

  - id: taichi-9070xt
    name: "ASRock Taichi RX 9070 XT OC"
    short_name: "Taichi 9070 XT"
    urls:                     # Standard + White (identical clocks, cooler, TGP, size)
      - "https://geizhals.de/asrock-radeon-rx-9070-xt-taichi-16gb-oc-a3430089.html"
      - "https://geizhals.de/asrock-radeon-rx-9070-xt-taichi-white-16gb-oc-90-ga5yzz-00uanz-a3698324.html"
    mpns: ["90-GA5HZZ-00UANF", "90-GA5YZZ-00UANZ", "RX9070XT TC 16GO"]
    target_price: 999         # ~9 % unter aktuell 1.099 € (Mindfactory); laut TechPowerUp leiseste/kühlste, Quiet-BIOS

  - id: mercury-9070xt
    name: "XFX Mercury RX 9070 XT OC Gaming RGB"
    short_name: "Mercury 9070 XT"
    urls:                     # OC Gaming RGB black + white (each also as "A" revision), identical specs.
      # NOT non-OC Gaming (2970 MHz, 2x 8-pin; user removed it), NOT Magnetic Air (different fan design)
      - "https://geizhals.de/xfx-mercury-radeon-rx-9070-xt-oc-gaming-edition-with-rgb-rx-97trgbbb9-a3430414.html"
      - "https://geizhals.de/xfx-mercury-radeon-rx-9070-xt-oc-gaming-edition-with-rgb-rx-97trgbbba-a3430418.html"
      - "https://geizhals.de/xfx-mercury-radeon-rx-9070-xt-oc-white-gaming-edition-with-rgb-rx-97trgbbw9-a3430416.html"
      - "https://geizhals.de/xfx-mercury-radeon-rx-9070-xt-oc-white-gaming-edition-with-rgb-rx-97trgbbwa-a3960653.html"
    shop_urls:
      - "https://www.alternate.de/XFX/Radeon-RX-9070-XT-OC-Mercury-RGB-Grafikkarte/html/product/100117812"
    mpns: ["RX-97TRGBBB9", "RX-97TRGBBBA", "RX-97TRGBBW9", "RX-97TRGBBWA"]
    target_price: 949         # ~8 % unter aktuell 1.029 € (nbb); 36 cm lang, kein Quiet-BIOS
    exclude_keywords: ["magnetic"]

  - id: nitro-9070xt
    name: "Sapphire Nitro+ RX 9070 XT"
    short_name: "Nitro+ 9070 XT"
    urls:                     # Standard + Crimson Desert / Valor Mortis editions + PhantomLink (also has a normal 12V-2x6), identical specs
      - "https://geizhals.de/sapphire-nitro-radeon-rx-9070-xt-11348-01-20g-a3430045.html"
      - "https://geizhals.de/sapphire-nitro-radeon-rx-9070-xt-oc-crimson-desert-11348-10-20g-a3709656.html"
      - "https://geizhals.de/sapphire-nitro-radeon-rx-9070-xt-oc-valor-mortis-edition-11348-12-20g-a3976126.html"
      - "https://geizhals.de/sapphire-nitro-radeon-rx-9070-xt-phantomlink-11348-08-20g-a3768816.html"
      - "https://geizhals.de/sapphire-nitro-radeon-rx-9070-xt-phantomlink-pe-11348-09-20g-a3768847.html"
    mpns: ["11348-01-20G", "11348-10-20G", "11348-12-20G", "11348-08-20G", "11348-09-20G"]
    target_price: 949         # Amazon-Angebot 960 € ist weg, aktuell 1.044 € (Galaxus); ~9 % darunter

  # ---------------- Monitore (exactly these models, no siblings) ----------------
  - id: xg27aqdmes
    name: "ASUS ROG Strix OLED XG27AQDMES"
    short_name: "ASUS XG27AQDMES"
    group: "Monitore"
    urls:                     # NOT XG27AQDMESZ / XG27AQDMG (different models)
      - "https://geizhals.de/asus-rog-strix-oled-xg27aqdmes-90lm0c80-b01171-a3684572.html"
    mpns: ["90LM0C80-B01171", "XG27AQDMES"]
    target_price: 379         # ~7 % unter aktuell 410 € (nbb)
    exclude_keywords: ["xg27aqdmesz", "xg27aqdmg"]

  - id: xg27aqdng
    name: "ASUS ROG Strix OLED XG27AQDNG"
    short_name: "ASUS XG27AQDNG"
    group: "Monitore"
    urls:                     # NOT XG27ACDNG / XG27AQDMG (different models)
      - "https://geizhals.de/asus-rog-strix-oled-xg27aqdng-90lm0ch0-b01971-a3689594.html"
    mpns: ["90LM0CH0-B01971", "XG27AQDNG"]
    target_price: 519         # ~9 % unter aktuell 567 € (Proshop); war schon ab ~525 € gelistet
    exclude_keywords: ["xg27acdng", "xg27aqdmg"]

compare: []
