      - "https://geizhals.de/xfx-mercury-radeon-rx-9070-xt-oc-gaming-edition-with-rgb-rx-97trgbbb9-a3430414.html"
      - "https://geizhals.de/xfx-mercury-radeon-rx-9070-xt-oc-gaming-edition-with-rgb-rx-97trgbbba-a3430418.html"
      - "https://geizhals.de/xfx-mercury-radeon-rx-9070-xt-oc-white-gaming-edition-with-rgb-rx-97trgbbw9-a3430416.html"
      - "https://geizhals.de/xfx-mercury-radeon-rx-9070-xt-oc-white-gaming-edition-with-rgb-rx-97trgbbwa-a3960653.html"
      - "https://geizhals.de/xfx-mercury-radeon-rx-9070-xt-gaming-edition-rx-97tmercb9-a3430425.html"
      - "https://geizhals.de/xfx-mercury-radeon-rx-9070-xt-gaming-edition-rx-97tmercba-a3463716.html"
