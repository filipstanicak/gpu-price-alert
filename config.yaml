  - id: nitro-9070xt
    name: "Sapphire Nitro+ RX 9070 XT"
    short_name: "Nitro+ 9070 XT"
    urls:                     # Standard + Crimson Desert / Valor Mortis editions + PhantomLink (also has a normal 12V-2x6), identical specs
      - "https://geizhals.de/sapphire-nitro-radeon-rx-9070-xt-11348-01-20g-a3430045.html"
      - "https://geizhals.de/sapphire-nitro-radeon-rx-9070-xt-oc-crimson-desert-11348-10-20g-a3709656.html"
      - "https://geizhals.de/sapphire-nitro-radeon-rx-9070-xt-oc-valor-mortis-edition-11348-12-20g-a3976126.html"
      - "https://geizhals.de/sapphire-nitro-radeon-rx-9070-xt-phantomlink-11348-08-20g-a3768816.html"
      - "https://geizhals.de/sapphire-nitro-radeon-rx-9070-xt-phantomlink-pe-11348-09-20g-a3768847.html"
    mpns: ["11348-01-20G", "11348-10-20G", "11348-12-20G", "11348-08-20G", "11348-09-20G"]
    target_price: 889         # ~7 % unter aktuell 960 € (Amazon)

compare: []
